<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>html,body{margin:0;background:#000}</style>
</head>
<body>
<div id="p"></div>
<script>
// Página do player do YouTube. Roda dentro de um iframe da interface (ou hospedada em um site https).
const pid = new URLSearchParams(location.search).get("pid");
let yt = null, ready = false, pending = null, wantPlay = false, vol = 0;
const send = (o) => parent.postMessage(Object.assign({ yt: 1, pid }, o), "*");

window.addEventListener("message", (e) => {
	if (e.source !== parent) return;
	const m = e.data || {};
	if (m.t === "load" && typeof m.id === "string" && /^[\w-]{11}$/.test(m.id)) { pending = m.id; if (ready) { yt.loadVideoById(m.id); yt.setVolume(vol); } }
	else if (m.t === "play") { wantPlay = true; if (ready) yt.playVideo(); }
	else if (m.t === "pause") { wantPlay = false; if (ready) yt.pauseVideo(); }
	else if (m.t === "vol") { vol = Number(m.v) || 0; if (ready) yt.setVolume(vol); }
});

window.onYouTubeIframeAPIReady = () => {
	yt = new YT.Player("p", {
		host: "https://www.youtube-nocookie.com",
		width: "200", height: "200",
		playerVars: { autoplay: 1, controls: 0, playsinline: 1, origin: location.origin },
		events: {
			onReady: () => { ready = true; yt.setVolume(vol); if (pending) yt.loadVideoById(pending); send({ t: "ready" }); },
			onStateChange: (e) => {
				if (e.data === YT.PlayerState.ENDED) send({ t: "ended" });
				else if (e.data === YT.PlayerState.PLAYING && !wantPlay) yt.pauseVideo();
			},
			onError: (e) => send({ t: "err", c: e.data }),
		},
	});
};

setInterval(() => {
	if (!ready) return;
	let title = "";
	try { title = yt.getVideoData().title || ""; } catch (_) {}
	send({ t: "time", cur: yt.getCurrentTime(), dur: yt.getDuration(), title });
}, 500);

const s = document.createElement("script");
s.src = "https://www.youtube.com/iframe_api";
s.onerror = () => send({ t: "err", c: -1 });
document.head.appendChild(s);
send({ t: "boot" });
</script>
</body>
</html>
